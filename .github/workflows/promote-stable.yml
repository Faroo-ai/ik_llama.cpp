name: Promote upstream main to stable

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Upstream SHA (default: ikawrakow main HEAD)'
        required: false

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ inputs.sha }}"
          [ -z "$SHA" ] && SHA=$(gh api repos/ikawrakow/ik_llama.cpp/commits/main --jq .sha)
          gh api -X PATCH repos/Faroo-ai/ik_llama.cpp/git/refs/heads/stable \
            -f sha="$SHA" -F force=true
          echo "stable -> $SHA"
